version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # 1. Nginx Edge Reverse Proxy & Rate Limiter
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: toast-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. TOAST Web & API Server (Next.js 15 App Router + REST API)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toast-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://toast_user:toast_university_pass@pgbouncer:6432/toast_university
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=toast_minio_admin
      - S3_SECRET_KEY=toast_minio_secret_key
      - S3_BUCKET=toast-university-vault
    depends_on:
      - pgbouncer
      - redis
      - minio
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. PgBouncer — Transaction Connection Pooler (10,000 -> 200 PG Connections)
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: toast-pgbouncer
    environment:
      - DATABASE_URL=postgres://toast_user:toast_university_pass@postgres:5432/toast_university
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=150
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. PostgreSQL 16 + pgvector (Core University Academic Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: toast-postgres
    environment:
      - POSTGRES_USER=toast_user
      - POSTGRES_PASSWORD=toast_university_pass
      - POSTGRES_DB=toast_university
    ports:
      - "5432:5432"
    volumes:
      - toast_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. Redis 7 (Sessions, Live Exam Buffers, Attendance Tokens & Job Queues)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: toast-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - toast_redisdata:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. MinIO Object Storage (S3-Compatible Presigned Upload & Compressed Vault)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: toast-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=toast_minio_admin
      - MINIO_ROOT_PASSWORD=toast_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - toast_miniodata:/data
    restart: unless-stopped

volumes:
  toast_pgdata:
  toast_redisdata:
  toast_miniodata:
